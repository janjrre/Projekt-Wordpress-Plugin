# PGP-05 offline integration of stacked draft PR28-PR31. No production data.
# Dedicated CI branch, no contexts, no backup, no remote services or artifacts.
version: 2.1

jobs:
  pgp05-stacked-offline:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Confirm isolated project branch and absence of backup credentials
          command: |
            set -euo pipefail
            [[ "${CIRCLE_PROJECT_USERNAME:-}" == "janjrre" ]]
            [[ "${CIRCLE_PROJECT_REPONAME:-}" == "Projekt-Wordpress-Plugin" ]]
            [[ "${CIRCLE_BRANCH:-}" == "ci/pgp05-stacked-offline-20261021" ]]
            for name in GH_TOKEN GITHUB_TOKEN BACKUP_GITHUB_TOKEN PGP04_APPROVED_SHA IONOS_SSH_HOST IONOS_SSH_USER IONOS_SSH_PASSWORD IONOS_DB_HOST IONOS_DB_PASSWORD SSH_PRIVATE_KEY BACKUP_RECOVERY_PRIVATE_KEY BACKUP_RECOVERY_PASSPHRASE ORGAVELA_BACKUP_PRIVATE_KEY AGE_SECRET_KEY; do
              [[ -z "${!name:-}" ]] || {
                echo "PGP05_STACKED_CI_SECRET=REFUSED" >&2
                exit 1
              }
            done
            echo "PGP05_STACKED_CI_ISOLATION=PASS"
      - run:
          name: Check synthetic-only OpenPGP and archive-validator integration
          command: |
            set -euo pipefail
            if ! command -v gpg >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends gnupg >/dev/null
            fi
            command -v gpg >/dev/null
            [[ -f .github/backup/orgavela-backup-candidate-public.asc ]]
            env -i PATH="$PATH" HOME=/tmp PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -v -s scripts/ci -p 'test_orgavela_pgp05*.py'
            echo "PGP05_STACKED_SYNTHETIC_ONLY=PASS"

workflows:
  pgp05-stacked-offline-only:
    jobs:
      - pgp05-stacked-offline:
          filters:
            branches:
              only:
                - ci/pgp05-stacked-offline-20261021
