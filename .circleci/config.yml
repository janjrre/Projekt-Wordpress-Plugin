version: 2.1
parameters:
  run_collector_port_tests:
    type: boolean
    default: false
jobs:
  collector-port-offline:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - checkout
      - run:
          name: Reject source, writer and recovery secrets
          command: |
            python - <<'PY'
            import os, sys
            sys.path.insert(0,'scripts/ci/production_backup')
            from github_api import reject_mixed_credentials
            for role in ('source','writer'):
                reject_mixed_credentials(os.environ,role)
            print('OFFLINE_CREDENTIAL_BOUNDARY=PASS')
            PY
      - run:
          name: Install local fixture runtimes only
          no_output_timeout: 5m
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends php-cli gnupg
            python -m venv /tmp/orgavela-offline-tests
            /tmp/orgavela-offline-tests/bin/pip install -r scripts/ci/production_backup/requirements-test.txt
      - run:
          name: Offline collector, encryption, writer and disposable-key recovery tests
          no_output_timeout: 5m
          command: |
            set -euo pipefail
            find scripts/ci/production_backup -name '*.php' -print0 | xargs -0 -n1 php -l
            php scripts/ci/production_backup/test_capture_helpers.php
            python -m unittest discover -s scripts/ci/production_backup -p test_collector_port.py -v
            python scripts/ci/production_backup/offline_integration.py --synthetic-only
            /tmp/orgavela-offline-tests/bin/python scripts/ci/production_backup/temporary_key_roundtrip.py
workflows:
  collector-port-offline-only:
    when: << pipeline.parameters.run_collector_port_tests >>
    jobs:
      - collector-port-offline:
          filters:
            branches:
              only: feat/pgp05-dreamloud-collector-port-20261023
            tags:
              ignore: /.*/
