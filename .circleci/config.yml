# OrgaVela W0/O03: Dreamloud-style two-job synthetic age pipeline.
# Isolated proposal on Draft PR #20, preserving the independent Draft PR #17
# no-secret pilot job. Their source branches still require ordered integration. NO real backup, deploy, secret context, GitHub
# release, schedule, automatic push, or production access.
version: 2.1

parameters:
  enable_pgp04_synthetic_release:
    type: boolean
    default: false

  enable_pgpony_ciphertext_handoff:
    type: boolean
    default: false

  enable_pgpony_openpgp_offline:
    type: boolean
    default: false

  enable_gh06_age_context_smoke:
    type: boolean
    default: false

  enable_gh06_age_release_offline:
    type: boolean
    default: false

  enable_gh05_synthetic_parity:
    type: boolean
    default: false

jobs:
  # Stage-B PRE-SECRET proof: verify protected branch may use the empty restricted
  # CircleCI context. No GitHub token, no remote release, no WordPress access.
  gh06-age-context-smoke:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify restricted GH06 context without secrets or remote API
          command: |
            set -euo pipefail
            test "$CIRCLE_PROJECT_USERNAME" = "janjrre"
            test "$CIRCLE_PROJECT_REPONAME" = "Projekt-Wordpress-Plugin"
            test "$CIRCLE_BRANCH" = "test/orgavela-age-release-o03"
            # Empty context is an absolute prerequisite for this smoke job.
            for key in GH_TOKEN BACKUP_GITHUB_TOKEN GITHUB_TOKEN AGE_SECRET_KEY \
                BACKUP_RECOVERY_PRIVATE_KEY BACKUP_RECOVERY_PASSPHRASE \
                IONOS_SSH_PASSWORD SFTP_HOST SFTP_PASSWORD SSH_PRIVATE_KEY \
                GOOGLE_DRIVE_TOKEN_JSON; do
              if test -n "$(printenv "$key" || true)"; then
                echo "REFUSED: GH06 context must remain empty of credentials"
                exit 1
              fi
            done
            echo 'GH06_CONTEXT_ACCESS=PASS'
            echo 'GH06_CONTEXT_SECRETS=NONE'
            echo 'GH06_GITHUB_RELEASE_UPLOADED=NO'

  # No secrets, no GitHub API, no source access: offline fake-provider gates.
  gh06-age-release-offline-qa:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/orgavela-gh06-offline
    steps:
      - checkout
      - run:
          name: Reject unsafe GH06 age inputs without real GitHub API
          command: |
            set -euo pipefail
            test "$CIRCLE_PROJECT_USERNAME" = "janjrre"
            test "$CIRCLE_PROJECT_REPONAME" = "Projekt-Wordpress-Plugin"
            test "$CIRCLE_BRANCH" = "feat/gh06-synthetic-age-release-20261020"
            for key in GH_TOKEN BACKUP_GITHUB_TOKEN SFTP_HOST SFTP_PASSWORD SSH_PRIVATE_KEY AGE_SECRET_KEY BACKUP_RECOVERY_PRIVATE_KEY BACKUP_RECOVERY_PASSPHRASE; do
              test -z "$(printenv "$key" || true)" || exit 1
            done
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends jq >/dev/null
            bash -n scripts/ci/orgavela-upload-github-release-age-synthetic.sh
            bash -n scripts/ci/orgavela-github-release-age-remote-e2e.sh
            python3 -m unittest discover -v -s scripts/ci -p 'test_orgavela_age_release_offline.py'

  # Retain the existing no-secret CircleCI pilot semantics from Draft PR #17.
  # This pilot executes ONLY on its own ci/circleci-free-pilot-o03 branch.
  offline-connection-smoke:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Verify OrgaVela repo identity, docs and no-source-access syntax
          command: |
            set -euo pipefail
            umask 077
            test "$CIRCLE_PROJECT_USERNAME" = "janjrre"
            test "$CIRCLE_PROJECT_REPONAME" = "Projekt-Wordpress-Plugin"
            test "$CIRCLE_BRANCH" = "ci/circleci-free-pilot-o03"
            for key in IONOS_SSH_HOST IONOS_SSH_USER IONOS_SSH_PASSWORD SFTP_HOST SFTP_PASSWORD GOOGLE_DRIVE_TOKEN_JSON ORGAVELA_RCLONE_CONFIG DUPLICATI_GOOGLE_DRIVE_AUTH_ID ORGAVELA_BACKUP_PRIVATE_KEY GH_TOKEN; do
              test -z "$(printenv "$key" || true)" || exit 1
            done
            for file in scripts/ci/*.sh; do
              bash -n "$file"
            done
            python scripts/ci/orgavela-circleci-offline-smoke.py

  gh05-synthetic-source:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/orgavela-source
    steps:
      - checkout
      - run:
          name: Verify no remote source or writer credentials are injected
          command: |
            set -euo pipefail
            test "$CIRCLE_PROJECT_USERNAME" = "janjrre"
            test "$CIRCLE_PROJECT_REPONAME" = "Projekt-Wordpress-Plugin"
            test "$CIRCLE_BRANCH" = "feat/gh05-synthetic-age-20261019"
            for key in GH_TOKEN BACKUP_GITHUB_TOKEN IONOS_SSH_PASSWORD SFTP_PASSWORD SFTP_HOST SSH_PRIVATE_KEY AGE_SECRET_KEY BACKUP_RECOVERY_PRIVATE_KEY; do
              test -z "$(printenv "$key" || true)" || exit 1
            done
      - run:
          name: Install signed distribution age CLI for disposable tests only
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends age >/dev/null
            age --version
            age-keygen --version
      - run:
          name: Verify synthetic fixture and release-envelope guard tests
          command: |
            set -euo pipefail
            python3 -m unittest discover -v -s scripts/ci -p 'test_orgavela_gh05_synthetic_age.py'
            python3 -m unittest discover -v -s scripts/ci -p 'test_orgavela_backup_parity.py'
      - run:
          name: Encrypt exclusively artificial source then drop temporary identity
          command: |
            set -euo pipefail
            umask 077
            test ! -e /tmp/orgavela-gh05-ciphertext
            mkdir -m 700 /tmp/orgavela-gh05-ciphertext
            python3 scripts/ci/orgavela_backup_parity.py producer \
              --synthetic-only --workspace /tmp/orgavela-gh05-ciphertext
            test "$(find /tmp/orgavela-gh05-ciphertext -maxdepth 1 -type f | wc -l)" = 3
      - persist_to_workspace:
          root: /tmp/orgavela-gh05-ciphertext
          paths:
            - "*"

  gh05-synthetic-writer:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/orgavela-writer
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/orgavela-gh05-ciphertext
      - run:
          name: Validate ciphertext-only handoff; no GitHub upload or tokens
          command: |
            set -euo pipefail
            umask 077
            test "$CIRCLE_PROJECT_USERNAME" = "janjrre"
            test "$CIRCLE_PROJECT_REPONAME" = "Projekt-Wordpress-Plugin"
            test "$CIRCLE_BRANCH" = "feat/gh05-synthetic-age-20261019"
            for key in GH_TOKEN BACKUP_GITHUB_TOKEN IONOS_SSH_PASSWORD SFTP_PASSWORD SFTP_HOST SSH_PRIVATE_KEY AGE_SECRET_KEY BACKUP_RECOVERY_PRIVATE_KEY; do
              test -z "$(printenv "$key" || true)" || exit 1
            done
            chmod 700 /tmp/orgavela-gh05-ciphertext
            chmod 600 /tmp/orgavela-gh05-ciphertext/*
            python3 scripts/ci/orgavela_backup_parity.py writer \
              --synthetic-only --workspace /tmp/orgavela-gh05-ciphertext
            echo 'GH05_PARITY_RELEASE_UPLOAD=disabled'
            echo 'GH05_PARITY_PRODUCTION_CAPTURE=disabled'


  # OpenPGP migration: run only explicitly requested manual synthetic tests.
  # No private owner key, CircleCI context, WordPress capture or remote release.
  pgpony-openpgp-offline-qa:
    docker:
      - image: cimg/base:stable
    resource_class: small
    working_directory: ~/orgavela-pgpony-offline
    steps:
      - checkout
      - run:
          name: Enforce public-only OpenPGP synthetic testing, no credentials
          command: |
            set -euo pipefail
            test "$CIRCLE_PROJECT_USERNAME" = "janjrre"
            test "$CIRCLE_PROJECT_REPONAME" = "Projekt-Wordpress-Plugin"
            test "$CIRCLE_BRANCH" = "feat/o03-pgpony-openpgp-migration-20261020"
            for key in GH_TOKEN GITHUB_TOKEN BACKUP_GITHUB_TOKEN SFTP_HOST \
                SFTP_USER SFTP_PASSWORD IONOS_SSH_HOST IONOS_SSH_PASSWORD \
                SSH_PRIVATE_KEY BACKUP_RECOVERY_PRIVATE_KEY \
                BACKUP_RECOVERY_PASSPHRASE ORGAVELA_BACKUP_PRIVATE_KEY \
                AGE_SECRET_KEY GOOGLE_DRIVE_TOKEN_JSON; do
              test -z "$(printenv "$key" || true)" || {
                echo "REFUSED: credential detected in PGPony offline QA"
                exit 1
              }
            done
            echo 'PGPONY_PUBLIC_ONLY=YES'
            echo 'PGPONY_PRODUCTION_CAPTURE=DISABLED'
            echo 'PGPONY_RELEASE_UPLOAD=DISABLED'
      - run:
          name: Install standard GnuPG and local fixture verification tools
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gnupg jq gzip tar coreutils >/dev/null
            gpg --version
      - run:
          name: Exercise pinned owner PUBLIC key and synthetic-only roundtrip
          command: |
            set -euo pipefail
            echo 'PGPONY_QA_STAGE=syntax'
            bash -n scripts/ci/orgavela-openpgp-synthetic-pack.sh
            bash -n scripts/ci/test-orgavela-openpgp-synthetic-pack.sh
            bash -n scripts/ci/test-orgavela-pgpony-public-key.sh
            echo 'PGPONY_QA_STAGE=public_key_preflight'
            bash scripts/ci/test-orgavela-pgpony-public-key.sh
            echo 'PGPONY_QA_STAGE=synthetic_openpgp_roundtrip'
            bash scripts/ci/test-orgavela-openpgp-synthetic-pack.sh
            echo 'PGPONY_OFFLINE_QA=PASS'


  # PGP-03 source: synthetically manufacture fake test components, encrypt
  # with PINNED PUBLIC key and persist only ciphertext, SHA256 and manifest.
  # No IONOS context, no real WordPress capture, no GitHub release API.
  pgpony-handoff-source:
    docker:
      - image: cimg/base:stable
    resource_class: small
    working_directory: ~/orgavela-pgpony-handoff
    steps:
      - checkout
      - run:
          name: Verify branch / install only public crypto verification tools
          command: |
            set -euo pipefail
            test "$CIRCLE_PROJECT_USERNAME" = "janjrre"
            test "$CIRCLE_PROJECT_REPONAME" = "Projekt-Wordpress-Plugin"
            test "$CIRCLE_BRANCH" = "feat/o03-pgpony-openpgp-migration-20261020"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gnupg jq gzip tar coreutils >/dev/null
      - run:
          name: Synthetic-only producer and all nine negative security checks
          command: |
            set -euo pipefail
            export ORGAVELA_PGP_SYNTHETIC_ONLY=YES
            bash -n scripts/ci/orgavela-openpgp-synthetic-handoff.sh
            bash -n scripts/ci/test-orgavela-openpgp-synthetic-handoff.sh
            bash scripts/ci/test-orgavela-openpgp-synthetic-handoff.sh
            bash scripts/ci/orgavela-openpgp-synthetic-handoff.sh producer /tmp/orgavela-pgpony-handoff
            echo 'PGPONY_HANDOFF_CI_SOURCE=PASS'
      - persist_to_workspace:
          root: /tmp/orgavela-pgpony-handoff
          paths:
            - orgavela-synthetic-pgpony-handoff-001.tar.gpg
            - orgavela-synthetic-pgpony-handoff-001.tar.gpg.sha256
            - manifest.json

  # PGP-03 writer: has NO decrypt/private key, NO GH_TOKEN and NO release API.
  pgpony-handoff-writer:
    docker:
      - image: cimg/base:stable
    resource_class: small
    working_directory: ~/orgavela-pgpony-handoff-writer
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/orgavela-pgpony-handoff
      - run:
          name: Ciphertext-only writer verifies encrypted handoff without secrets
          command: |
            set -euo pipefail
            test "$CIRCLE_PROJECT_USERNAME" = "janjrre"
            test "$CIRCLE_PROJECT_REPONAME" = "Projekt-Wordpress-Plugin"
            test "$CIRCLE_BRANCH" = "feat/o03-pgpony-openpgp-migration-20261020"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gnupg jq coreutils >/dev/null
            export ORGAVELA_PGP_SYNTHETIC_ONLY=YES
            bash scripts/ci/orgavela-openpgp-synthetic-handoff.sh writer /tmp/orgavela-pgpony-handoff
            echo 'PGPONY_HANDOFF_CI_WRITER=PASS'

  # PGP04: owner PGPony key PUBLIC-only producer. Never receives Context or GitHub token.
  pgp04-synthetic-source:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: PGP04 fake source only and public OpenPGP encryption
          command: |
            set -euo pipefail
            test "$CIRCLE_PROJECT_USERNAME" = janjrre
            test "$CIRCLE_PROJECT_REPONAME" = Projekt-Wordpress-Plugin
            test "$CIRCLE_BRANCH" = security/pgp04-synthetic-release-20261020
            for key in GH_TOKEN GITHUB_TOKEN BACKUP_GITHUB_TOKEN SFTP_HOST SFTP_PASSWORD IONOS_SSH_HOST IONOS_SSH_PASSWORD BACKUP_RECOVERY_PRIVATE_KEY BACKUP_RECOVERY_PASSPHRASE AGE_SECRET_KEY; do
              test -z "$(printenv "$key" || true)"
            done
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gnupg jq gzip tar coreutils >/dev/null
            export ORGAVELA_PGP_SYNTHETIC_ONLY=YES
            bash scripts/ci/orgavela-openpgp-synthetic-handoff.sh producer /tmp/orgavela-pgp04-handoff
            echo PGP04_SOURCE_CIPHERTEXT_ONLY=PASS
      - persist_to_workspace:
          root: /tmp/orgavela-pgp04-handoff
          paths:
            - orgavela-synthetic-pgpony-handoff-001.tar.gpg
            - orgavela-synthetic-pgpony-handoff-001.tar.gpg.sha256
            - manifest.json

  # PGP04 isolated token-bearing writer: only on locked reviewed SHA and restricted Context.
  pgp04-synthetic-release-writer:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/orgavela-pgp04-handoff
      - run:
          name: One-time synthetic ciphertext Release with immutable verification
          command: |
            set -euo pipefail
            test "$CIRCLE_PROJECT_USERNAME" = janjrre
            test "$CIRCLE_PROJECT_REPONAME" = Projekt-Wordpress-Plugin
            test "$CIRCLE_BRANCH" = security/pgp04-synthetic-release-20261020
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gnupg jq gh coreutils >/dev/null
            export ORGAVELA_PGP_SYNTHETIC_ONLY=YES
            export PGP04_OPERATOR_APPROVED=YES
            export GITHUB_BACKUP_REPOSITORY=janjrre/orgavela-backups
            bash scripts/ci/orgavela-pgpony-synthetic-release-writer.sh /tmp/orgavela-pgp04-handoff

workflows:

  pgp04-synthetic-release-manual:
    when: << pipeline.parameters.enable_pgp04_synthetic_release >>
    jobs:
      - pgp04-synthetic-source:
          filters:
            branches:
              only:
                - security/pgp04-synthetic-release-20261020
      - pgp04-synthetic-release-writer:
          context:
            - orgavela-pgp04-release-only
          requires:
            - pgp04-synthetic-source
          filters:
            branches:
              only:
                - security/pgp04-synthetic-release-20261020

  pgpony-ciphertext-handoff-manual:
    when: << pipeline.parameters.enable_pgpony_ciphertext_handoff >>
    jobs:
      - pgpony-handoff-source:
          filters:
            branches:
              only:
                - feat/o03-pgpony-openpgp-migration-20261020
      - pgpony-handoff-writer:
          requires:
            - pgpony-handoff-source
          filters:
            branches:
              only:
                - feat/o03-pgpony-openpgp-migration-20261020


  pgpony-openpgp-offline-manual:
    when: << pipeline.parameters.enable_pgpony_openpgp_offline >>
    jobs:
      - pgpony-openpgp-offline-qa:
          filters:
            branches:
              only:
                - feat/o03-pgpony-openpgp-migration-20261020

  gh06-age-context-smoke-manual:
    when: << pipeline.parameters.enable_gh06_age_context_smoke >>
    jobs:
      - gh06-age-context-smoke:
          context:
            - orgavela-age-release-tests
          filters:
            branches:
              only:
                - test/orgavela-age-release-o03

  gh06-age-release-offline-manual:
    when: << pipeline.parameters.enable_gh06_age_release_offline >>
    jobs:
      - gh06-age-release-offline-qa:
          filters:
            branches:
              only:
                - feat/gh06-synthetic-age-release-20261020

  connection-pilot-only:
    jobs:
      - offline-connection-smoke:
          filters:
            branches:
              only:
                - ci/circleci-free-pilot-o03

  gh05-synthetic-parity-manual:
    when: << pipeline.parameters.enable_gh05_synthetic_parity >>
    jobs:
      - gh05-synthetic-source:
          filters:
            branches:
              only:
                - feat/gh05-synthetic-age-20261019
      - gh05-synthetic-writer:
          requires:
            - gh05-synthetic-source
          filters:
            branches:
              only:
                - feat/gh05-synthetic-age-20261019
