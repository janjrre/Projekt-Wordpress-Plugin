# PGP-05: default offline suite plus explicit, approval-gated SSH probes.
# No backups/deploys/schedules/artifacts/workspaces. Live contexts are separate.
version: 2.1

parameters:
  pgp05_ssh_probe:
    type: enum
    enum: ['off', hostkey, metadata]
    default: 'off'

jobs:
  pgp05-offline-security:
    docker:
      - image: docker.io/cimg/python@sha256:793ca7ea5a2fc27fa5b379fd077bf571c456d103992c7b3098cfc885f46cfa08
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Verify exact OrgaVela repository and branch, reject credential injection
          command: |
            set -euo pipefail
            [[ "${CIRCLE_PROJECT_USERNAME:-}" == "janjrre" ]]
            [[ "${CIRCLE_PROJECT_REPONAME:-}" == "Projekt-Wordpress-Plugin" ]]
            [[ "${CIRCLE_BRANCH:-}" == "feat/pgp05-readonly-ssh-metadata-check-20261021" ]]
            for name in PGP05_SSH_HOST PGP05_SSH_USER PGP05_SSH_PASSWORD PGP05_WP_ROOT PGP05_APPROVED_SHA PGP05_ZERO_COST_CONFIRMED PGP05_REMOTE_SHA256 PGP05_STARTUP_REVIEWED PGP05_METADATA_REVIEW_REF IONOS_SSH_HOST IONOS_SSH_USER IONOS_SSH_PASSWORD IONOS_DB_HOST IONOS_DB_PASSWORD IONOS_KNOWN_HOSTS GH_TOKEN GITHUB_TOKEN BACKUP_GITHUB_TOKEN ORGAVELA_BACKUP_PRIVATE_KEY BACKUP_RECOVERY_PRIVATE_KEY BACKUP_RECOVERY_PASSPHRASE AGE_SECRET_KEY; do
              [[ -z "${!name:-}" ]] || {
                echo "PGP05_CI_UNEXPECTED_SECRET=REFUSED" >&2
                exit 1
              }
            done
            echo "PGP05_CI_ISOLATION=PASS"
      - run:
          name: Contextless runtime identity and required local primitives
          command: |
            set -euo pipefail
            [[ "$(uname -m)" == "x86_64" ]]
            for binary in /usr/bin/ssh /usr/bin/ssh-keyscan /usr/bin/python3 /bin/sh /usr/bin/id /usr/bin/stat /usr/bin/env; do
              [[ -x "$binary" ]]
            done
            env -i PATH=/usr/bin:/bin HOME=/tmp LC_ALL=C /usr/bin/ssh -V
            env -i PATH=/usr/bin:/bin HOME=/tmp LC_ALL=C /usr/bin/python3 --version
            env -i PATH="$PATH" HOME=/tmp LC_ALL=C python3 -E -s -c 'import sys; sys.path.insert(0, "scripts/ci"); import orgavela_pgp05_circleci_ssh_probe as p; [p.trusted_binary(x) for x in (p.SSH, p.KEYSCAN, "/usr/bin/python3")]; print("PGP05_LOCAL_RUNTIME=PASS")'
      - run:
          name: Test only PGP-05 synthetic guards without injected environment
          command: |
            set -euo pipefail
            bash -n scripts/ci/orgavela_pgp05_readonly_remote_collect.sh
            code=0
            response="$(bash scripts/ci/orgavela_pgp05_readonly_remote_collect.sh 2>&1)" || code=$?
            [[ "$code" -eq 78 && "$response" == "PGP05_REMOTE_IDENTITY=REFUSED" ]]
            env -i PATH="$PATH" HOME=/tmp PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -v -s scripts/ci -p 'test_orgavela_pgp05*.py'
            echo "PGP05_OFFLINE_SECURITY=PASS"

  pgp05-ssh-probe:
    parameters:
      mode:
        type: enum
        enum: [hostkey, metadata]
    docker:
      - image: docker.io/cimg/python@sha256:793ca7ea5a2fc27fa5b379fd077bf571c456d103992c7b3098cfc885f46cfa08
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Approved revision only; bounded SSH probe with sanitized output
          no_output_timeout: 2m
          command: |
            set +x
            set -euo pipefail
            [[ "${CIRCLE_PROJECT_USERNAME:-}" == "janjrre" ]]
            [[ "${CIRCLE_PROJECT_REPONAME:-}" == "Projekt-Wordpress-Plugin" ]]
            [[ "${CIRCLE_BRANCH:-}" == "feat/pgp05-readonly-ssh-metadata-check-20261021" ]]
            [[ "${CIRCLE_SHA1:-}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${PGP05_APPROVED_SHA:-}" == "$CIRCLE_SHA1" ]]
            [[ "$(git rev-parse HEAD)" == "$CIRCLE_SHA1" ]]
            python3 -E -s scripts/ci/orgavela_pgp05_circleci_ssh_probe.py --mode << parameters.mode >> --live-opt-in

workflows:
  pgp05-branch-only:
    when:
      equal: ['off', << pipeline.parameters.pgp05_ssh_probe >>]
    jobs:
      - pgp05-offline-security:
          filters:
            branches:
              only:
                - feat/pgp05-readonly-ssh-metadata-check-20261021

  pgp05-hostkey-one-shot:
    when:
      equal: [hostkey, << pipeline.parameters.pgp05_ssh_probe >>]
    jobs:
      - pgp05-offline-security:
          filters:
            branches:
              only: [feat/pgp05-readonly-ssh-metadata-check-20261021]
      - approve-pgp05-hostkey:
          type: approval
          requires: [pgp05-offline-security]
          filters:
            branches:
              only: [feat/pgp05-readonly-ssh-metadata-check-20261021]
      - pgp05-ssh-probe:
          name: pgp05-hostkey-candidate
          mode: hostkey
          requires: [approve-pgp05-hostkey]
          context: orgavela-pgp05-hostkey-only
          filters:
            branches:
              only: [feat/pgp05-readonly-ssh-metadata-check-20261021]

  pgp05-metadata-one-shot:
    when:
      equal: [metadata, << pipeline.parameters.pgp05_ssh_probe >>]
    jobs:
      - pgp05-offline-security:
          filters:
            branches:
              only: [feat/pgp05-readonly-ssh-metadata-check-20261021]
      - approve-pgp05-metadata:
          type: approval
          requires: [pgp05-offline-security]
          filters:
            branches:
              only: [feat/pgp05-readonly-ssh-metadata-check-20261021]
      - pgp05-ssh-probe:
          name: pgp05-reviewed-ssh-metadata
          mode: metadata
          requires: [approve-pgp05-metadata]
          context: orgavela-pgp05-reviewed-metadata
          filters:
            branches:
              only: [feat/pgp05-readonly-ssh-metadata-check-20261021]
