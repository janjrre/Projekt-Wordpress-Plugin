# OrgaVela W0/O03: CircleCI Free connection pilot.
# ONLY this dedicated branch. NO secrets, Drive, IONOS, deployments,
# production data, schedules, caches or artifacts.
version: 2.1

jobs:
  offline-connection-smoke:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Verify OrgaVela repo identity, documentation and local shell syntax only
          command: |
            set -euo pipefail
            umask 077
            [[ "${CIRCLE_PROJECT_USERNAME:-}" == "janjrre" ]]
            [[ "${CIRCLE_PROJECT_REPONAME:-}" == "Projekt-Wordpress-Plugin" ]]
            [[ "${CIRCLE_BRANCH:-}" == "ci/circleci-free-pilot-o03" ]]

            # A first-run smoke job must never receive any production credentials.
            for secret_name in \
              IONOS_SSH_HOST IONOS_SSH_USER IONOS_SSH_PASSWORD \
              SFTP_HOST SFTP_PASSWORD GOOGLE_DRIVE_TOKEN_JSON \
              ORGAVELA_RCLONE_CONFIG DUPLICATI_GOOGLE_DRIVE_AUTH_ID \
              ORGAVELA_BACKUP_PRIVATE_KEY; do
              [[ -z "${!secret_name:-}" ]] || {
                echo "ERROR: unexpected secret injected into the offline pilot" >&2
                exit 1
              }
            done

            for file in scripts/ci/*.sh; do
              bash -n "$file"
            done
            python - <<'PY'
            import json
            from pathlib import Path

            root = Path.cwd()
            required = [
                "AGENTS.md",
                "docs/operations/V1_ACCEPTANCE_PLAN.md",
                "docs/operations/V1_PROGRESS.json",
                "docs/operations/W0_O03_CIRCLECI_GITHUB_BACKUP_ASSESSMENT_2026-10-13.md",
                "scripts/ci/orgavela-readonly-audit.sh",
                "scripts/ci/orgavela-synthetic-restore.sh",
            ]
            assert all((root / name).is_file() for name in required)
            state = json.loads((root / "docs/operations/V1_PROGRESS.json").read_text())
            counts = state["measurements"]
            assert counts["milestone_count"] == 8
            assert counts["reported_implemented_packages"] <= counts["normative_packages"]
            assert counts["milestones_formally_v1_accepted"] <= counts["milestone_count"]
            assert counts["release_gates_formally_green"] <= counts["release_gates_total"]
            assert not counts["v1_release_accepted"]
            o03 = next(item for item in state["ops"] if item["id"] == "O03")
            assert o03["status"] != "completed"
            assert not o03["formal_accepted"]
            assert o03["actual_isolated_restoration"] == "not performed"
            print("ORGAVELA_CIRCLECI_OFFLINE_SMOKE=success")
            print("ORGAVELA_CIRCLECI_LIVE_BACKUP_USED=no")
            print("ORGAVELA_CIRCLECI_LIVE_RESTORE=no")
            PY

workflows:
  connection-pilot-only:
    jobs:
      - offline-connection-smoke:
          filters:
            branches:
              only:
                - ci/circleci-free-pilot-o03
