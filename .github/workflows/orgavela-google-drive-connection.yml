name: OrgaVela - encrypted Google Drive connection check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orgavela-google-drive-connection.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: "selftest uses synthetic data locally; upload-synthetic sends ONLY encrypted canary to Drive"
        type: choice
        options: [selftest, upload-synthetic]
        default: selftest
        required: true

permissions:
  contents: read

concurrency:
  group: orgavela-drive-connection
  cancel-in-progress: false

jobs:
  crypto-selftest:
    if: github.repository == 'janjrre/Projekt-Wordpress-Plugin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install encryption utility on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age >/dev/null
      - name: Verify synthetic-only age encrypt/decrypt roundtrip
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          age-keygen -o "$temp/synthetic-private-key.txt" >/dev/null 2>&1
          recipient="$(age-keygen -y "$temp/synthetic-private-key.txt")"
          printf '%s\n' 'Synthetic OrgaVela encryption test: NO real WordPress or participant data.' > "$temp/payload.txt"
          age -r "$recipient" -o "$temp/payload.txt.age" "$temp/payload.txt"
          age -d -i "$temp/synthetic-private-key.txt" -o "$temp/roundtrip.txt" "$temp/payload.txt.age"
          cmp "$temp/payload.txt" "$temp/roundtrip.txt"
          echo "ORGAVELA_DRIVE_ENCRYPTION_SELFTEST=success"
          echo "ORGAVELA_DRIVE_LIVE_DATA_USED=no"

  upload-synthetic:
    if: github.repository == 'janjrre/Projekt-Wordpress-Plugin' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'upload-synthetic'
    needs: [crypto-selftest]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: orgavela-backup-drive
    env:
      AGE_PUBLIC_RECIPIENT: ${{ vars.ORGAVELA_BACKUP_AGE_RECIPIENT }}
      RCLONE_BACKUP_CONFIG: ${{ secrets.ORGAVELA_RCLONE_CONFIG }}
    steps:
      - name: Verify required operator-owned encryption and Drive authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AGE_PUBLIC_RECIPIENT" =~ ^age1[0-9a-z]{50,64}$ ]] || {
            echo "::error::Missing or malformed AGE recipient in orgavela-backup-drive environment. No upload."; exit 1;
          }
          [[ -n "$RCLONE_BACKUP_CONFIG" ]] || {
            echo "::error::Missing operator-installed ORGAVELA_RCLONE_CONFIG secret. No upload."; exit 1;
          }
      - name: Install local encryption and transport utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age rclone >/dev/null
      - name: Encrypt synthetic canary and upload encrypted bytes only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          config="$temp/rclone.conf"
          printf '%s\n' "$RCLONE_BACKUP_CONFIG" > "$config"
          chmod 600 "$config"
          # Require exactly one named remote and explicit folder rooting;
          # never run a command that traverses the user's entire Google Drive.
          [[ "$(grep -c '^\[' "$config")" == 1 ]] || {
            echo "::error::Drive config must contain only the orgavela_drive remote."; exit 1;
          }
          grep -Eq '^\[orgavela_drive\]$' "$config" || exit 1
          grep -Eq '^[[:space:]]*type[[:space:]]*=[[:space:]]*drive[[:space:]]*$' "$config" || exit 1
          grep -Eq '^[[:space:]]*root_folder_id[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{15,}[[:space:]]*$' "$config" || {
            echo "::error::Drive config must pin an operator-verified backup folder ID."; exit 1;
          }
          file_name="orgavela-SYNTHETIC-connection-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt.age"
          printf '%s\n' 'Synthetic Drive canary. NO live WordPress content, credentials or participant data.' \
            | age -r "$AGE_PUBLIC_RECIPIENT" -o "$temp/$file_name"
          [[ -s "$temp/$file_name" ]] || exit 1
          # rclone config is OAuth-sensitive. Keep secrets and filenames off the log.
          if ! rclone --config "$config" copyto "$temp/$file_name" "orgavela_drive:$file_name" --immutable --quiet \
            >/dev/null 2> "$temp/rclone-error"; then
            echo "::error::Encrypted test upload failed. Check Drive OAuth configuration/permissions; raw provider output withheld."
            exit 1
          fi
          if ! rclone --config "$config" lsf "orgavela_drive:" --files-only --quiet \
            2> "$temp/check-error" | grep -Fxq "$file_name"; then
            echo "::error::Encrypted canary not verified in the pinned Drive folder; raw provider output withheld."
            exit 1
          fi
          echo "ORGAVELA_DRIVE_ENCRYPTED_CANARY=verified"
          echo "ORGAVELA_DRIVE_LIVE_BACKUP_CREATED=no"
          echo "ORGAVELA_DRIVE_PRIVATE_KEY_ON_GITHUB=no"
