name: OrgaVela - strictly read-only SSH health audit

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "probe checks shell and exact OrgaVela identity; schema reads UOP health and aggregates"
        required: true
        type: choice
        default: probe
        options: [probe, schema]
  push:
    branches: [main]
    paths:
      - '.github/audit-requests/orgavela-readonly.json'

permissions:
  contents: read

concurrency:
  group: orgavela-readonly-audit
  cancel-in-progress: false

jobs:
  readonly-audit:
    if: github.repository == 'janjrre/Projekt-Wordpress-Plugin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: orgavela-ionos
    env:
      IONOS_AUDIT_SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
      IONOS_AUDIT_SSH_USER: ${{ secrets.IONOS_SSH_USER }}
      SSHPASS: ${{ secrets.IONOS_SSH_PASSWORD }}
      IONOS_AUDIT_WP_ROOT: ${{ vars.IONOS_WP_ROOT || '/public' }}
    steps:
      - name: Checkout only trusted main workflow and read-only script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate checked-in SSH script syntax
        shell: bash
        run: bash -n scripts/ci/orgavela-readonly-audit.sh
      - name: Resolve explicit read-only audit request
        env:
          MANUAL_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            request='.github/audit-requests/orgavela-readonly.json'
            [[ -f "$request" ]] || exit 1
            operation="$(jq -er '.operation // empty' "$request")"
            target="$(jq -er '.target // empty' "$request")"
            [[ "$target" == 'orgavela.com' ]] || {
              echo "::error::Audit request target must be orgavela.com."; exit 1;
            }
          else
            operation="$MANUAL_OPERATION"
          fi
          [[ "$operation" == 'probe' || "$operation" == 'schema' ]] || {
            echo "::error::Only read-only probe/schema operations are permitted."; exit 1;
          }
          printf 'AUDIT_OPERATION=%s\n' "$operation" >> "$GITHUB_ENV"
      - name: Install SSH transport (runner only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Run scoped read-only audit with secret-safe output
        shell: bash
        run: bash scripts/ci/orgavela-readonly-audit.sh "$AUDIT_OPERATION"
