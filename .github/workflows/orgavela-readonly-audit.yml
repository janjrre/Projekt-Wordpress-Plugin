name: OrgaVela - strictly read-only SSH health audit

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "probe checks shell and exact OrgaVela identity; schema reads UOP health and aggregates"
        required: true
        type: choice
        default: probe
        options: [probe, schema]
      confirm_dedicated_access:
        description: "Confirmed: separate OrgaVela-only SSH account; NOT full-webspace / credentials"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orgavela-readonly-audit
  cancel-in-progress: false

jobs:
  readonly-audit:
    if: github.repository == 'janjrre/Projekt-Wordpress-Plugin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: orgavela-audit
    env:
      IONOS_AUDIT_SSH_HOST: ${{ secrets.IONOS_AUDIT_SSH_HOST }}
      IONOS_AUDIT_SSH_USER: ${{ secrets.IONOS_AUDIT_SSH_USER }}
      SSHPASS: ${{ secrets.IONOS_AUDIT_SSH_PASSWORD }}
      IONOS_AUDIT_WP_ROOT: ${{ vars.IONOS_AUDIT_WP_ROOT }}
    steps:
      - name: Checkout only trusted main workflow and read-only script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate checked-in SSH script syntax
        shell: bash
        run: bash -n scripts/ci/orgavela-readonly-audit.sh
      - name: Validate explicitly confirmed isolated access
        env:
          MANUAL_OPERATION: ${{ inputs.operation }}
          DEDICATED_ACCESS_CONFIRMED: ${{ inputs.confirm_dedicated_access }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MANUAL_OPERATION" == probe || "$MANUAL_OPERATION" == schema ]] || {
            echo "::error::Only read-only probe or schema operations are permitted."; exit 1;
          }
          [[ "$DEDICATED_ACCESS_CONFIRMED" == true ]] || {
            echo "::error::The existing IONOS SSH/SFTP account has full / webspace access. Do not reuse it; confirm an independently restricted OrgaVela account before audit."; exit 1;
          }
          printf 'AUDIT_OPERATION=%s\n' "$MANUAL_OPERATION" >> "$GITHUB_ENV"
      - name: Install SSH transport (runner only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Run scoped read-only audit with secret-safe output
        shell: bash
        run: bash scripts/ci/orgavela-readonly-audit.sh "$AUDIT_OPERATION"
