name: M6-10 disposable HTTPS and Mailpit E2E

on:
  pull_request:
    paths:
      - '.github/workflows/uop-https-e2e.yml'
      - 'tests/Browser/m610-https.spec.js'
      - 'tests/Fixtures/m610-https-router.php'
      - 'tests/Fixtures/m610-https-proxy.mjs'
      - 'tests/Fixtures/m610-mailpit.php'
      - 'src/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-https:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: uop_ephemeral
          MYSQL_DATABASE: uop_ephemeral
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h localhost -puop_ephemeral"
          --health-interval=10s --health-timeout=5s --health-retries=12
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - '1025:1025'
          - '8025:8025'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, zip
          tools: composer:v2, wp-cli
          coverage: none
      - name: Ensure verified WP CLI
        run: bash bin/ensure-wp-cli.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate disposable test helpers
        run: |
          php -l tests/Fixtures/m610-https-router.php
          php -l tests/Fixtures/m610-mailpit.php
          node --check tests/Fixtures/m610-https-proxy.mjs
      - name: Install disposable WordPress with independent database
        env:
          COMPOSER_ROOT_VERSION: 0.1.0-alpha.2
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          npm ci
          export WP_ROOT="$RUNNER_TEMP/uop-https-wp"
          echo "WP_ROOT=$WP_ROOT" >> "$GITHUB_ENV"
          password="$(openssl rand -hex 20)"
          echo "::add-mask::$password"
          echo "WP_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          wp core download --version=6.9 --path="$WP_ROOT"
          wp config create --path="$WP_ROOT" --dbname=uop_ephemeral --dbuser=root --dbpass=uop_ephemeral --dbhost=127.0.0.1 --dbcharset=utf8mb4 --dbprefix=uop_https_
          wp config set WP_DEBUG true --raw --path="$WP_ROOT"
          wp config set DISABLE_WP_CRON true --raw --path="$WP_ROOT"
          wp core install --path="$WP_ROOT" --url="https://127.0.0.1:8443" --title="UOP isolated HTTPS" --admin_user=uop_test_admin --admin_password="$password" --admin_email=uop-ci@example.invalid --skip-email
          ln -s "$GITHUB_WORKSPACE" "$WP_ROOT/wp-content/plugins/uop-core"
          mkdir -p "$WP_ROOT/wp-content/mu-plugins"
          cp tests/Fixtures/m610-mailpit.php "$WP_ROOT/wp-content/mu-plugins/uop-ci-mailpit.php"
          wp plugin activate uop-core --path="$WP_ROOT"
      - name: Generate a fresh local-only self-signed HTTPS certificate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uop-https-tls"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -sha256 \
            -keyout "$RUNNER_TEMP/uop-https-tls/key.pem" \
            -out "$RUNNER_TEMP/uop-https-tls/cert.pem" \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" >/dev/null 2>&1
          echo "UOP_HTTPS_KEY=$RUNNER_TEMP/uop-https-tls/key.pem" >> "$GITHUB_ENV"
          echo "UOP_HTTPS_CERT=$RUNNER_TEMP/uop-https-tls/cert.pem" >> "$GITHUB_ENV"
      - name: Start loopback-only HTTP WordPress and HTTPS reverse proxy
        run: |
          set -euo pipefail
          PHP_CLI_SERVER_WORKERS=4 php -d memory_limit=512M -S 127.0.0.1:8080 \
            -t "$WP_ROOT" "$GITHUB_WORKSPACE/tests/Fixtures/m610-https-router.php" \
            > "$RUNNER_TEMP/uop-https-php.log" 2>&1 &
          node tests/Fixtures/m610-https-proxy.mjs > "$RUNNER_TEMP/uop-https-proxy.log" 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS --cacert "$UOP_HTTPS_CERT" \
                https://127.0.0.1:8443/wp-login.php >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Disposable HTTPS WordPress was not ready" >&2
            tail -n 60 "$RUNNER_TEMP/uop-https-php.log" || true
            tail -n 60 "$RUNNER_TEMP/uop-https-proxy.log" || true
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8025/api/v1/messages >/dev/null; then
              break
            fi
            sleep 1
          done
      - name: Prove WordPress SMTP delivery is captured by Mailpit, not external mail
        run: |
          set -euo pipefail
          wp eval 'if (!wp_mail("uop-ci@example.invalid", "UOP HTTPS isolated SMTP smoke", "Local disposable mail proof")) { exit(1); }' --path="$WP_ROOT"
          for i in $(seq 1 20); do
            count="$(curl -fsS http://127.0.0.1:8025/api/v1/messages | jq '[.messages[] | select(.Subject == "UOP HTTPS isolated SMTP smoke")] | length')"
            if [ "$count" = "1" ]; then
              break
            fi
            sleep 1
          done
          test "$count" = "1"
      - name: Real browser verification of HTTPS and test mail inbox
        env:
          UOP_HTTPS_E2E: '1'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/Browser/m610-https.spec.js
      - name: Upload browser and WordPress diagnostics (never email contents)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m610-https-diagnostics
          path: |
            test-results/
          if-no-files-found: warn
          retention-days: 7
