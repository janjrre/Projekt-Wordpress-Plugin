name: Temporary UOP Age Branch Formatter
on:
  push:
    branches:
      - feat/p4-age-evidence
permissions:
  contents: write
concurrency:
  group: temporary-uop-age-formatter
  cancel-in-progress: false
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Apply standard WPCS auto-fixes without reducing any lint rules
        shell: bash
        run: |
          vendor/bin/phpcbf src/REST/AgeAttestationController.php src/Infrastructure/Database/AgeAttestationSchema.php src/Infrastructure/Database/AgeAttestationRepository.php src/Infrastructure/Database/AgeAttestationMigration.php src/Application/Identity/AgeAttestationService.php src/Application/Registration/RegistrationFactsService.php src/Infrastructure/Database/Installer.php src/Infrastructure/Database/SchemaInspector.php || result=$?
          if [ "${result:-0}" -gt 1 ]; then exit "${result}"; fi
          git diff --check
          git add src/REST/AgeAttestationController.php src/Infrastructure/Database/AgeAttestationSchema.php src/Infrastructure/Database/AgeAttestationRepository.php src/Infrastructure/Database/AgeAttestationMigration.php src/Application/Identity/AgeAttestationService.php src/Application/Registration/RegistrationFactsService.php src/Infrastructure/Database/Installer.php src/Infrastructure/Database/SchemaInspector.php
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(age): apply PHP coding standards auto-fixes"
            git push origin HEAD:feat/p4-age-evidence
          fi
